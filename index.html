<script>
(function(){
  var ITER = 300000;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
  function b64(s){ var bin = atob(s), out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
  async function unlock(pw){
    var raw = b64(document.getElementById('data').textContent.trim());
    var salt = raw.slice(8, 16), ct = raw.slice(16);               // OpenSSL "Salted__" + 8-byte salt + ciphertext
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    var bits = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', salt:salt, iterations:ITER, hash:'SHA-256'}, base, 384));
    var key = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    var plain = new Uint8Array(await crypto.subtle.decrypt({name:'AES-CBC', iv:bits.slice(32, 48)}, key, ct));
    if (plain[0] === 0x1f && plain[1] === 0x8b) {                  // the game is gzip-compressed before it is locked (smaller, faster to unlock)
      if (!window.DecompressionStream) { var old = new Error('old'); old.old = true; throw old; }
      plain = new Uint8Array(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
    }
    var html = new TextDecoder().decode(plain);
    if (html.indexOf('<!doctype html>') !== 0) throw new Error('wrong password');
    return html;
  }
  function open(html){ document.open(); document.write(html); document.close(); }
  function showLock(msg){
    document.getElementById('loading').hidden = true;
    document.getElementById('lock').hidden = false;
    document.getElementById('err').textContent = msg || '';
    document.getElementById('pw').focus();
  }
  document.getElementById('lock').addEventListener('submit', async function(ev){
    ev.preventDefault();
    var pw = document.getElementById('pw').value, btn = document.getElementById('go');
    btn.disabled = true; btn.textContent = 'Checking…';
    try { var html = await unlock(pw); try { localStorage.setItem('sg-pass', pw); } catch(e){} open(html); }
    catch(e){ btn.disabled = false; btn.textContent = 'Play'; showLock(e.old ? 'This device needs a newer iOS (16.4 or later) to open the game.' : 'That password didn’t work. Check the spelling and try again.'); }
  });
  var saved = null; try { saved = localStorage.getItem('sg-pass'); } catch(e){}
  if (saved) unlock(saved).then(open).catch(function(e){ showLock(e && e.old ? 'This device needs a newer iOS (16.4 or later) to open the game.' : ''); }); else showLock();
})();
</script>
